group = 'com.vnegar.digimaze_pdf_reader_launcher'
version = '1.0.0'

plugins {
    id 'com.android.library'
}

def pluginLibsDir = file("$projectDir/libs")

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://pkgs.dev.azure.com/MicrosoftDeviceSDK/DuoSDK-Public/_packaging/Duo-SDK-Feed/maven/v1'
        }

        flatDir {
            dirs pluginLibsDir
        }
    }
}

def libsDir = file("$projectDir/libs")

def aarFilesToDownload = [
        'FoxitRDK.aar'            : 'https://files.digimaze.org/FoxitRDK.aar',
        'FoxitRDKUIExtensions.aar': 'https://files.digimaze.org/FoxitRDKUIExtensions.aar'
]

tasks.register('downloadAarFiles') {
    doLast {
        libsDir.mkdirs()
        aarFilesToDownload.each { fileName, url ->
            def target = new File(libsDir, fileName)

            if (!target.exists()) {
                println "Downloading ${fileName} ..."
                def tmp = new File(libsDir, "${fileName}.tmp")
                new URL(url).withInputStream { input ->
                    tmp.withOutputStream { output ->
                        output << input
                    }
                }

                def header = tmp.withInputStream { it.readNBytes(2) }
                if (tmp.length() < 1024 || header.size() < 2 || header[0] != (byte) 'P' || header[1] != (byte) 'K') {
                    tmp.delete()
                    throw new GradleException(
                            "Downloaded '${fileName}' does not look like a valid .aar file " +
                                    "(too small or not a zip archive). Check the URL is correct and publicly reachable: ${url}"
                    )
                }

                tmp.renameTo(target)
                println "Downloaded ${fileName} (${target.length() / 1024 / 1024} MB)"
            } else {
                println "${fileName} already exists, skipping download."
            }
        }
    }
}

tasks.named('preBuild') {
    dependsOn downloadAarFiles
}

android {
    namespace 'com.vnegar.digimaze_pdf_reader_launcher'

    compileSdk 37

    defaultConfig {
        minSdk 26
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }

        consumerProguardFiles 'proguard-rules.pro'
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lintOptions {
        disable 'InvalidPackage'
        disable 'GradleDependency'
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation(name: 'FoxitRDK', ext: 'aar')
    implementation(name: 'FoxitRDKUIExtensions', ext: 'aar')
    implementation 'com.edmodo:cropper:2.0.0'
    implementation 'com.microsoft.identity.client:msal:8.4.2'
    implementation 'com.nostra13.universalimageloader:universal-image-loader:1.9.5'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'com.google.mlkit:digital-ink-recognition:19.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.23.0'
}